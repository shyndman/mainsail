name: Release

run-name: Release from ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v6
        with:
          ref: 'develop'
          fetch-depth: 0

      - name: Derive version from base + short hash
        id: ver
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          HASH=$(git rev-parse --short HEAD)
          echo "version=${BASE}-g${HASH}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into package.json
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.ver.outputs.version }}"

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Move build out of dist
        shell: bash
        run: mv ./dist/mainsail.zip ./mainsail.zip

      - name: Get latest tag
        id: latest_tag
        shell: bash
        run: |
          echo "TAG_NAME=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: generate-changelog
        with:
          config: ./cliff-release.toml
          args: ${{ steps.latest_tag.outputs.TAG_NAME }}..HEAD

      - name: Create release and upload build
        uses: softprops/action-gh-release@v2
        id: create-release
        with:
          name: v${{ steps.ver.outputs.version }}
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: develop
          files: ./mainsail.zip
          body: ${{ steps.generate-changelog.outputs.content }}

  update-changelog:
    needs: ['release']
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: 'develop'
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        shell: bash
        run: |
          echo "TAG_NAME=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: v0.0.4..${{ steps.latest_tag.outputs.TAG_NAME }}
        env:
          OUTPUT: ${{ github.workspace }}/CHANGELOG.md

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs(changelog): update changelog'
          file_pattern: CHANGELOG.md
